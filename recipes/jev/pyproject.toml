[project]
name = "bandits-jev"
version = "0.1.0"
description = "Train your own Jev-style decision model from Bandits traces and verifiers."
requires-python = ">=3.11"
dependencies = [
    # Bandits core, read-only: traces, turn-judge runs, task sets, the artifact
    # store. Core never imports this package.
    "bandits",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
train = [
    # Scoring, training and serving a real model. Lazy-imported, so the recipe's
    # data, calibration and report code and most tests run without it; the
    # tests that need it run a real tiny model on CPU in CI's `jev` job.
    "torch>=2.2",
    "transformers>=5.2",  # first release with Qwen3.5
    "peft>=0.12",
]
tinker = [
    # Train and score through the Tinker API instead of a local GPU. torch runs
    # the custom loss client-side and transformers loads the tokenizer; neither
    # needs a GPU.
    "tinker>=0.31",
    "torch>=2.2",
    "transformers>=4.44",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
jev = "bandits_jev.cli:app"

[tool.uv.sources]
bandits = { path = "../..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bandits_jev"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["bandits_jev", "bandits"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
