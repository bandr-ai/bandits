[project]
name = "bandits-sft-synth"
version = "0.1.0"
description = "Simia+: extrapolate seed agent traces into more SFT traces, with no environment."
requires-python = ">=3.11"
dependencies = [
    # Standalone: does not import Bandits core.
    "openai>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
simia-plus = "simia_plus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simia_plus"]

[tool.ruff]
line-length = 130

[tool.pytest.ini_options]
testpaths = ["tests"]
