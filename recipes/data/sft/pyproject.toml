[project]
name = "bandits-sft-synth"
version = "0.2.0"
description = "Bandits trace generation: extrapolate seed agent traces into more SFT traces, with no environment."
requires-python = ">=3.11"
dependencies = [
    # Standalone: does not import Bandits core.
    "openai>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
bandits-sft = "bandits_sft.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bandits_sft"]  # includes bandits_sft/rubrics/*.md and bandits_sft/defaults/*.json (package data)

[tool.hatch.build.targets.wheel.force-include]
"LICENSE-UPSTREAM" = "bandits_sft/LICENSE-UPSTREAM"

[tool.ruff]
line-length = 130

[tool.pytest.ini_options]
testpaths = ["tests"]
