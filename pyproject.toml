[project]
# The import package and the command are both `bandits`; the PyPI name
# `bandits` belongs to an unrelated project.
name = "bandits-cli"
dynamic = ["version", "readme"]
description = "Turn agent traces into training data you can trust: ingest, judge, verify, and export SFT and RL data."
requires-python = ">=3.11"
authors = [{ name = "Bandr" }]
keywords = ["agents", "traces", "llm", "evaluation", "verifiers", "sft", "rl", "opentelemetry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
llm = [
    # Every model call goes through LiteLLM (see bandits/providers.py). Optional
    # so the core install and the Jev recipe's environment never pull it in.
    "litellm>=1.100",
]
audit = [
    # RLM mining and its advisory audit only. Kept out of the core install so the
    # pipeline keeps its three runtime dependencies and CI never needs a model
    # or a REPL sandbox; their tests inject a predictor instead.
    "dspy[deno]>=3.3.1",
    "litellm>=1.100",
]
emulate = [
    # Prompt optimization and schema-checked trace-grounded world simulation.
    "dspy[deno]>=3.3.1",
    "jsonschema>=4.23",
    "litellm>=1.100",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/bandr-ai/bandits"
Source = "https://github.com/bandr-ai/bandits"
Issues = "https://github.com/bandr-ai/bandits/issues"
Changelog = "https://github.com/bandr-ai/bandits/blob/main/CHANGELOG.md"

[project.scripts]
bandits = "bandits.cli:app"

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "bandits/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["bandits"]

[tool.hatch.build.targets.sdist]
include = ["bandits", "tests", "README.md", "CHANGELOG.md", "pyproject.toml"]

# PyPI renders the README away from the repo, so relative links and images
# would break there. Point them at GitHub in the published copy only.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(\]\(|src=")(?!https?://|#)([^)"]+\.(?:png|webp|gif|svg|jpg))'
replacement = '\1https://raw.githubusercontent.com/bandr-ai/bandits/main/\2'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(\]\(|src=")(?!https?://|#)([^)"]+)'
replacement = '\1https://github.com/bandr-ai/bandits/blob/main/\2'

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",
    "UP042",  # str+Enum kept for json round-trip stability
    "B008",   # typer.Option(...) as a default is the framework's own idiom
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["bandits"]
omit = ["*/*_test.py"]
