[project]
name = "bandits"
version = "0.1.0"
description = "Ingest agent traces into an inspectable local corpus."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
audit = [
    # The family coherence audit only. Kept out of the core install so the
    # pipeline keeps its three runtime dependencies and CI never needs a model
    # or a REPL sandbox; the audit's own tests inject a predictor instead.
    "dspy[deno]>=3.3.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
bandits = "bandits.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bandits"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",
    "UP042",  # str+Enum kept for json round-trip stability
    "B008",   # typer.Option(...) as a default is the framework's own idiom
]

[tool.pytest.ini_options]
testpaths = ["tests", "bandits"]
addopts = "-q"

[tool.coverage.run]
omit = ["*/*_test.py"]
