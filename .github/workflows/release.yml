name: release

# Push a tag like v0.2.0 to publish that version to PyPI and create the GitHub
# release. Publishing uses PyPI trusted publishing, so no token is stored here.
# See docs/releasing.md.

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5

      - name: Tag, package version and changelog agree
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' bandits/__init__.py)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match bandits/__init__.py version $version"
            exit 1
          fi
          if ! grep -q "^## \[$version\] - [0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md needs a dated '## [$version] - YYYY-MM-DD' section"
            exit 1
          fi

      - run: uv sync --extra dev --extra emulate
      - run: uv run ruff check .
      - run: uv run pytest

      - run: uv build
      - run: uvx twine check --strict dist/*
      - run: scripts/smoke_wheel.sh dist/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/bandits-cli/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release from the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[.*\]: / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "bandits-cli $version" \
            --notes-file notes.md \
            --verify-tag
