name: release

# Push a tag like v0.3.1 to publish that version of both distributions to PyPI
# (`bandr`, and the Mint-only `bandr-mint` built from recipes/mint) and create
# the GitHub release. Publishing uses PyPI trusted publishing, so no token is stored here.
# See docs/releasing.md.

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5

      - name: Tag, package version and changelog agree
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' bandits/__init__.py)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match bandits/__init__.py version $version"
            exit 1
          fi
          if ! grep -q "^## \[$version\] - [0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md needs a dated '## [$version] - YYYY-MM-DD' section"
            exit 1
          fi

      - run: uv sync --extra dev
      - name: Distribution versions agree
        run: |
          uv run python - <<'PY'
          import tomllib
          from pathlib import Path
          import bandits
          import mint
          recipe = tomllib.loads(Path("recipes/mint/pyproject.toml").read_text())
          assert bandits.__version__ == mint.__version__ == recipe["project"]["version"]
          PY
      - run: uv run ruff check bandits mint tests examples/mint
      - run: uv run ruff format --check bandits mint tests examples/mint
      - run: uv run pytest

      - run: uv build
      - run: uvx twine check --strict dist/*
      - run: scripts/smoke_wheel.sh dist/*.whl

      - run: uv build recipes/mint --out-dir dist-mint
      - run: uvx twine check --strict dist-mint/*
      - run: scripts/smoke_mint_wheel.sh dist-mint/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-mint
          path: dist-mint/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/bandr/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: dist-mint
          path: dist-mint/
      # Each PyPI project needs its own trusted publisher for this workflow and
      # environment. skip-existing lets a re-run finish a half-done publish.
      - name: Publish bandr
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
      - name: Publish bandr-mint
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-mint/
          skip-existing: true

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: dist-mint
          path: dist-mint/
      - name: Create the GitHub release from the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[.*\]: / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* dist-mint/* \
            --title "bandr $version" \
            --notes-file notes.md \
            --verify-tag
