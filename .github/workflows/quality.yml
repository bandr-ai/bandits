name: quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev --extra emulate
      - run: uv run ruff check .
      - run: uv run pytest --cov=bandits --cov-report=term-missing

  decide:
    # Decision-model tests against a real tiny model (hf-internal-testing/
    # tiny-random-gpt2) on CPU. Separate from `test` because it installs
    # torch and downloads a model; skipped there without the decide extra.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-tiny-random-gpt2-v1
      - run: uv sync --extra dev
      # CPU-only torch wheel: the default PyPI wheel pulls ~3 GB of CUDA libs.
      - run: uv pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
      - run: uv pip install "transformers>=4.44" "peft>=0.12"
      - run: uv run --no-sync pytest tests/decide -q
