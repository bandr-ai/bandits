name: quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run ruff check bandits tests
      - run: uv run ruff format --check bandits tests
      - run: uv run pytest tests --cov=bandits --cov-report=term-missing

  package:
    # Build what a release would publish and run it from a clean install, so a
    # packaging break shows up on the PR, not on release day.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uvx twine check --strict dist/*
      - run: scripts/smoke_wheel.sh dist/*.whl
