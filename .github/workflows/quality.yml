name: quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev --extra emulate
      - run: uv run ruff check .
      - run: uv run pytest --cov=bandits --cov-report=term-missing
